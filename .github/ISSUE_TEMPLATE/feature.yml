name: Docs, usability, or package request
description: Suggest a documentation, usability, validation, or existing package improvement
title: "[Usability]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: The public catalog is currently frozen, so this form does not add new Skill records. Use it for a concrete documentation, usability, validation, or existing reviewed-package improvement. Include the desired outcome and a reproducible example when possible.
  - type: textarea
    id: job
    attributes:
      label: Job to be done
      description: Describe the real request and desired deliverable.
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Current gap
      description: What is difficult, unreliable, or missing today?
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Request type
      options:
        - Existing reviewed package or workflow
        - Documentation or usability
        - Validation or provenance
        - WorkBuddy integration or installation
        - Other
    validations:
      required: true
