name: Bug report
description: Report a reproducible skill or packaging problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove secrets, tokens, and private customer data before submitting.
  - type: input
    id: version
    attributes:
      label: WorkBuddy or package version
      placeholder: WorkBuddy 4.x / package v4.66.0
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request and observed behavior
      description: What did you ask WorkBuddy to do, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error or trace
      render: shell
