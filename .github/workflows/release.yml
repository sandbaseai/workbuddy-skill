name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: ./scripts/package_skill.sh
      # Replaces softprops/action-gh-release@v3.0.3 with rate-limited CLI uploads.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Upload assets with rate limiting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in dist/*-workbuddy-skill.zip; do
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
            sleep 1
          done
