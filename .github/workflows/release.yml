name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate frozen catalog
        run: python3 scripts/validate_catalog.py --minimum 10000 --require-analysis --check-stats
      - name: Validate generated site and package data
        run: |
          python3 scripts/build_site_data.py
          python3 scripts/validate_site_data.py
          python3 scripts/verify_catalog_snapshot.py
      - run: ./scripts/package_skill.sh
      - name: Create release checksums
        run: (cd dist && sha256sum *-workbuddy-skill.zip > SHA256SUMS)
      # Replaces softprops/action-gh-release@v3.0.3 with rate-limited CLI uploads.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Upload assets with rate limiting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for archive in dist/*-workbuddy-skill.zip; do
            asset_name=$(basename "$archive")
            if printf '%s\n' "$existing_assets" | grep -Fxq "$asset_name"; then
              echo "Already uploaded: $asset_name"
              continue
            fi
            gh release upload "$GITHUB_REF_NAME" "$archive"
            sleep 1
          done
          if printf '%s\n' "$existing_assets" | grep -Fxq "SHA256SUMS"; then
            echo "Already uploaded: SHA256SUMS"
          else
            gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS
          fi
      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for archive in dist/*-workbuddy-skill.zip; do
            asset_name=$(basename "$archive")
            if ! printf '%s\n' "$release_assets" | grep -Fxq "$asset_name"; then
              echo "Missing uploaded release asset: $asset_name" >&2
              exit 1
            fi
          done
          if ! printf '%s\n' "$release_assets" | grep -Fxq "SHA256SUMS"; then
            echo "Missing uploaded release asset: SHA256SUMS" >&2
            exit 1
          fi
      - name: Verify downloaded release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-download
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*-workbuddy-skill.zip' \
            --pattern 'SHA256SUMS' \
            --dir release-download \
            --clobber
          python3 scripts/verify_release.py release-download
