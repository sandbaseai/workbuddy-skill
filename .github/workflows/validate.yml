name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python3 scripts/validate_skill.py
      - run: python3 scripts/validate_catalog.py --minimum 10000 --require-analysis
      - run: python3 scripts/build_site_data.py
      - run: ./scripts/package_skill.sh
