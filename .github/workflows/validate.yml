name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python3 scripts/validate_skill.py
      - run: python3 scripts/validate_catalog.py --minimum 10000 --require-analysis
      - run: python3 scripts/build_site_data.py
      - run: python3 scripts/validate_site_data.py
      - run: python3 scripts/verify_catalog_snapshot.py
      - run: python3 -m py_compile scripts/*.py
      - run: python3 -m unittest discover -s tests -v
      - run: ./scripts/package_skill.sh
