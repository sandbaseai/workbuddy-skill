name: Check resource links

on:
  push:
    paths:
      - "README.md"
      - "docs/**"
      - "site/**"
      - "scripts/check_resource_links.py"
      - ".github/workflows/check-resource-links.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "site/**"
      - "scripts/check_resource_links.py"
      - ".github/workflows/check-resource-links.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: Check public resource links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python3 scripts/check_resource_links.py
