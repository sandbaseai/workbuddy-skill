name: Enable safe auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# This workflow never checks out or executes pull-request code. It only asks
# GitHub to queue an auto-merge for trusted branches in this repository.
permissions:
  contents: write
  pull-requests: write

jobs:
  queue:
    name: Queue trusted pull request
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
