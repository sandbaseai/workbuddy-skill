name: Clean up merged branches

on:
  pull_request:
    types: [closed]

# This workflow never checks out pull-request code. It deletes only a merged
# branch whose head repository is this repository, and never deletes main.
permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete merged same-repository branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch when safe
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$MERGED" != "true" ]]; then
            echo "Pull request was closed without merging."
            exit 0
          fi
          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "Fork branch; leaving it to the fork owner."
            exit 0
          fi
          if [[ -z "$BRANCH" || "$BRANCH" == "main" ]]; then
            echo "Refusing to delete an empty or protected default branch name."
            exit 0
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
