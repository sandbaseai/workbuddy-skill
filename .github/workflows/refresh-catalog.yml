name: Refresh skill catalog

on:
  schedule:
    # Revisit GitHub's public Skill surface throughout the day while the
    # crawler's request/rate-limit bounds keep each run finite and resumable.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-skill-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Refresh provenance index
        id: crawl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=0
          if [ -f catalog/skills.jsonl ]; then
            cp catalog/skills.jsonl /tmp/skills.jsonl
            current=$(wc -l < catalog/skills.jsonl)
          fi
          if [ "$current" -lt 10000 ]; then current=10000; fi
          target=$((current + 100))
          echo "Refreshing catalog from $current toward $target records"
          set +e
          python3 scripts/crawl_github_skills.py --target "$target" \
            --repository github/awesome-copilot \
            --repository anthropics/skills \
            --repository mvanhorn/last30days-skill \
            --repository kepano/obsidian-skills \
            --repository op7418/guizang-ppt-skill \
            --repository nicobailon/visual-explainer \
            --repository microsoft/playwright \
            --repository aws-samples/sample-agentcore-launchpad \
            --repository aws-samples/sample-aws-resilience-skill \
            --repository wshobson/agents \
            --repository microsoft/skills \
            --repository vercel-labs/skills \
            --repository addyosmani/agent-skills \
            --repository K-Dense-AI/scientific-agent-skills \
            --repository microsoft/SkillOpt \
            --repository nextlevelbuilder/ui-ux-pro-max-skill \
            --repository googleworkspace/cli \
            --repository VoltAgent/awesome-agent-skills \
            --repository vercel-labs/agent-skills \
            --repository google/skills \
            --repository phuryn/pm-skills \
            --repository alirezarezvani/claude-skills \
            --repository muratcankoylan/Agent-Skills-for-Context-Engineering \
            --repository DietrichGebert/ponytail \
            --repository nexu-io/open-design \
            --repository sickn33/agentic-awesome-skills \
            --max-requests 60 \
            --max-rate-wait 120 --output /tmp/skills.jsonl
          crawl_status=$?
          set -e
          if [ "$crawl_status" -ne 0 ] && [ "$crawl_status" -ne 2 ]; then
            exit "$crawl_status"
          fi
          discovered=$(wc -l < /tmp/skills.jsonl)
          if [ "$discovered" -le "$current" ]; then
            echo "No new records before the rate-limit boundary; resume on the next run"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Discovered $((discovered - current)) new records; continuing with analysis"
      - name: Analyze WorkBuddy compatibility
        if: steps.crawl.outputs.changed == 'true'
        run: python3 scripts/analyze_catalog.py /tmp/skills.jsonl
      - name: Validate provenance index
        if: steps.crawl.outputs.changed == 'true'
        run: |
          python3 scripts/validate_catalog.py /tmp/skills.jsonl --minimum 10000 --require-analysis
          cp /tmp/skills.jsonl catalog/skills.jsonl
          test -f /tmp/stats.json
          cp /tmp/stats.json catalog/stats.json
          test -f /tmp/analysis-stats.json
          cp /tmp/analysis-stats.json catalog/analysis-stats.json
          python3 scripts/validate_catalog.py --minimum 10000 --require-analysis --check-stats
          python3 scripts/update_readme_stats.py --catalog-only
      - name: Publish catalog update
        if: steps.crawl.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/refresh-skill-catalog"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add README.md catalog/README.md catalog/skills.jsonl catalog/stats.json catalog/analysis-stats.json
          if git diff --cached --quiet; then
            echo "Catalog is already current"
            exit 0
          fi
          git commit -m "chore: refresh public skill catalog"
          for file in catalog/skills.jsonl catalog/stats.json catalog/analysis-stats.json; do
            git show "HEAD:$file" > "/tmp/refresh-$(basename "$file")"
          done
          if git push --force-with-lease origin "$branch"; then
            pr_url=$(gh pr list --base main --head "$branch" --state open \
              --json url --jq '.[0].url')
            if [ -z "$pr_url" ]; then
              if ! pr_url=$(gh pr create --base main --head "$branch" \
                --title "chore: refresh public skill catalog" \
                --body "Automated provenance-only catalog refresh. Validation passed in this workflow."); then
                echo "PR creation is disabled; publishing the validated snapshot directly to main"
                for attempt in 1 2 3; do
                  git fetch origin main
                  git show origin/main:catalog/stats.json > /tmp/current-stats.json
                  git rebase --abort >/dev/null 2>&1 || true
                  # The runner is disposable; start from a clean remote baseline
                  # so an interrupted rebase cannot leave conflict markers behind.
                  git reset --hard origin/main
                  python3 - <<'PY'
          import json
          from pathlib import Path

          base_path = Path("catalog/skills.jsonl")
          refresh_path = Path("/tmp/refresh-skills.jsonl")
          rows = {}
          for path in (base_path, refresh_path):
              for line in path.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      row = json.loads(line)
                      rows[row["id"]] = row
          ordered = [rows[key] for key in sorted(rows, key=str.casefold)]
          base_path.write_text(
              "".join(json.dumps(row, ensure_ascii=False, sort_keys=True) + "\n" for row in ordered),
              encoding="utf-8",
          )
          refresh_stats = json.loads(Path("/tmp/refresh-stats.json").read_text(encoding="utf-8"))
          current_stats = json.loads(Path("/tmp/current-stats.json").read_text(encoding="utf-8"))
          stats = {
              "records": len(ordered),
              "unique_content_shas": len({row["sha"] for row in ordered}),
              "repositories": len({row["repository"] for row in ordered}),
              "requests": max(refresh_stats["requests"], current_stats["requests"]),
              "queries_over_github_cap": max(
                  refresh_stats["queries_over_github_cap"],
                  current_stats["queries_over_github_cap"],
              ),
          }
          stats_text = json.dumps(stats, indent=2, sort_keys=True) + "\n"
          Path("catalog/stats.json").write_text(stats_text, encoding="utf-8")
          Path("/tmp/merged-stats.json").write_text(stats_text, encoding="utf-8")
          analysis = {
              "adaptable": sum(row.get("workbuddy_status") == "adaptable" for row in ordered),
              "analysis_ok": sum(row.get("analysis_status") == "ok" for row in ordered),
              "analyzed_paths": len(ordered),
              "analyzed_unique_shas": len({row["sha"] for row in ordered if row.get("analysis_status")}),
              "needs_review": sum(row.get("workbuddy_status") == "needs-review" for row in ordered),
              "security_flagged": sum(row.get("security_status") == "flagged" for row in ordered),
              "workbuddy_ready": sum(row.get("workbuddy_status") == "workbuddy-ready" for row in ordered),
          }
          analysis_text = json.dumps(analysis, indent=2, sort_keys=True) + "\n"
          Path("catalog/analysis-stats.json").write_text(analysis_text, encoding="utf-8")
          Path("/tmp/merged-analysis-stats.json").write_text(analysis_text, encoding="utf-8")
          PY
                  python3 scripts/update_readme_stats.py \
                    --catalog-only \
                    --stats /tmp/merged-stats.json \
                    --analysis /tmp/merged-analysis-stats.json
                  python3 scripts/validate_catalog.py --minimum 10000 --require-analysis
                  git add README.md catalog/README.md catalog/skills.jsonl catalog/stats.json catalog/analysis-stats.json
                  git commit -m "chore: reconcile concurrent catalog refresh"
                  if git push origin "HEAD:main"; then
                    git push origin --delete "$branch" || true
                    exit 0
                  fi
                  echo "main advanced during publish; retrying (${attempt}/3)"
                  sleep 2
                done
                echo "Unable to publish the validated catalog after concurrent updates" >&2
                exit 1
              fi
            fi
            echo "Enabling auto-merge for $pr_url"
            gh pr merge "$pr_url" --auto --squash --delete-branch
          else
            echo "Unable to publish the validated catalog branch" >&2
            exit 1
          fi
