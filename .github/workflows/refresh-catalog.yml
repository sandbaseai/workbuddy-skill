name: Refresh skill catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  frozen-catalog-check:
    name: Verify frozen catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate upstream source manifest
        run: python3 scripts/validate_source_manifest.py
      - name: Validate frozen catalog
        run: python3 scripts/validate_catalog.py --minimum 10000 --require-analysis --check-stats
      - name: Verify catalog README statistics
        run: |
          python3 scripts/update_readme_stats.py --catalog-only
          git diff --exit-code -- catalog/README.md
      - name: Rebuild and validate published site data
        run: |
          python3 scripts/build_site_data.py
          python3 scripts/validate_site_data.py
          python3 scripts/verify_catalog_snapshot.py
      - name: Verify latest release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_assets.py
      - name: Check public resource links
        run: python3 scripts/check_resource_links.py

  upstream-discovery-probe:
    name: Probe upstream Skill sources (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate upstream source manifest
        run: python3 scripts/validate_source_manifest.py
      - name: Scan declared public Skill repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source_count=$(grep -Ev '^[[:space:]]*(#|$)' config/upstream-skill-sources.txt | wc -l)
          max_requests=$((source_count * 3 + 50))
          echo "Scanning $source_count repositories with a $max_requests-request budget"
          python3 scripts/crawl_github_skills.py \
            --dry-run \
            --repository-file config/upstream-skill-sources.txt \
            --repository-only \
            --allow-partial \
            --target 50000 \
            --max-requests "$max_requests" \
            --max-rate-wait 120 \
            --output /tmp/upstream-skill-probe.jsonl \
            --dry-run-output /tmp/upstream-skill-probe-report.jsonl \
            --status-output /tmp/upstream-skill-probe-status.json
          cat /tmp/upstream-skill-probe-status.json
          python3 scripts/report_new_discoveries.py \
            --catalog catalog/skills.jsonl \
            --discovery /tmp/upstream-skill-probe-report.jsonl \
            --output /tmp/upstream-skill-new-candidates.jsonl
          python3 scripts/analyze_discovery.py \
            --input /tmp/upstream-skill-new-candidates.jsonl \
            --output /tmp/upstream-skill-new-candidates-reviewed.jsonl \
            --summary-output /tmp/upstream-skill-discovery-summary.json \
            --workers 24 \
            --retries 1 \
            --timeout 10
      - name: Add discovery summary
        run: |
          python3 - /tmp/upstream-skill-discovery-summary.json <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          summary = json.loads(open(sys.argv[1], encoding="utf-8").read())
          print("## Read-only upstream Skill discovery")
          print("")
          print("| Metric | Count |")
          print("| --- | ---: |")
          for key, label in (
              ("candidate_records", "New candidate records"),
              ("candidate_repositories", "Candidate repositories"),
              ("unique_contents", "Unique contents"),
              ("adaptable", "Adaptable"),
              ("needs_review", "Needs review"),
              ("license_declared", "License declared"),
              ("license_missing", "License missing"),
              ("security_flagged", "Static security flags"),
          ):
              print(f"| {label} | {summary.get(key, 0)} |")
          status = json.loads(open("/tmp/upstream-skill-probe-status.json", encoding="utf-8").read())
          print("")
          print(f"Probe status: **{status['status']}** ({status['records']} records, {status['requests']} requests)")
          if status.get("error"):
              print(f"\n> The read-only probe paused after a partial result: `{status['error']}`")
          PY
      - name: Add actionable candidate shortlist
        run: |
          python3 - /tmp/upstream-skill-new-candidates-reviewed.jsonl <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from collections import defaultdict
          import json
          import sys

          grouped = defaultdict(list)
          with open(sys.argv[1], encoding="utf-8") as handle:
              for line in handle:
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  if (
                      row.get("workbuddy_status") == "adaptable"
                      and row.get("license_declared") is True
                      and row.get("security_status") == "no-static-flags"
                  ):
                      grouped[row.get("repository", "")].append(row)

          candidates = sorted(
              ((repository, rows) for repository, rows in grouped.items() if repository),
              key=lambda item: (-len(item[1]), item[0].casefold()),
          )[:20]
          print("## Actionable candidate shortlist")
          print("")
          print("These candidates are adaptable, declare a license, and have no static flags; review the exact pinned source before packaging.")
          print("")
          print("| Repository | Candidate Skills | Example source |")
          print("| --- | ---: | --- |")
          for repository, rows in candidates:
              example = min(rows, key=lambda row: row.get("id", ""))
              print(f"| `{repository}` | {len(rows)} | [{example.get('name_hint', 'SKILL.md')}]({example['source_url']}) |")
          if not candidates:
              print("No candidates met all three shortlist conditions in this run.")
          PY
      - name: Upload read-only discovery report
        uses: actions/upload-artifact@v7
        with:
          name: upstream-skill-probe-${{ github.run_id }}
          path: |
            /tmp/upstream-skill-probe-report.jsonl
            /tmp/upstream-skill-new-candidates.jsonl
            /tmp/upstream-skill-new-candidates-reviewed.jsonl
            /tmp/upstream-skill-discovery-summary.json
            /tmp/upstream-skill-probe-status.json
          retention-days: 30
