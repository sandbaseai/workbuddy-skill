name: Refresh skill catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-catalog-check:
    name: Verify frozen catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate frozen catalog
        run: python3 scripts/validate_catalog.py --minimum 10000 --require-analysis --check-stats
